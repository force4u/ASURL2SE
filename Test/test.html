<h1>applescript: スキーム受信テスト</h1>
<p>Safari / Firefox / Arc などで開き、リンクをクリックして、検証アプリのアラートが出るか確認します。</p>
<ul>
  <li><a href="applescript://com.apple.scripteditor/?action=new&amp;script=beep">1. 最小(beep)</a></li>
  <li><a href="applescript://com.apple.scripteditor/?action=new&amp;name=link_test&amp;script=display%20dialog%20%22hello%22%0D%E6%97%A5%E6%9C%AC%E8%AA%9E%E3%82%B3%E3%83%A1%E3%83%B3%E3%83%88">2. CR改行(%0D)と日本語を含む</a></li>
  <li><a href="applescript://com.apple.scripteditor/?action=new&amp;script=beep%0Abeep%0A">3. LF改行(%0A)</a></li>
  <li><a href="applescript://com.apple.scripteditor?action=new&amp;script=beep">4. 末尾スラッシュなし</a></li>
</ul>
<p>注意: これらのリンクはスクリプトを実行しません。この検証アプリは内容を表示するだけです。</p>
